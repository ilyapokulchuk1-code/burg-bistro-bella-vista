name: Optimize and install restaurant gallery
on:
  push:
    branches: [main]
    paths:
      - gallery-setup-trigger.txt
permissions:
  contents: write
jobs:
  setup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize uploaded PNGs
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for p in Path('images').glob('*.png'):
              out = p.with_suffix('.webp')
              im = Image.open(p).convert('RGB')
              im.save(out, 'WEBP', quality=82, method=6)
              p.unlink()
          PY
      - name: Add gallery script to site
        run: |
          cat > gallery.js <<'EOF'
          (() => {
            const imgs = [
              ['06DDD719-7AB9-463B-8167-274963FF29EA.webp','Innenraum'],
              ['54944608-51D1-4738-B9F9-C3051BA90CD0.webp','Innenraum'],
              ['8EBDDCBB-BA99-4BE3-8885-1DB4A3AB708C.webp','Terrasse'],
              ['61F4B0A2-C809-43D6-B068-6B9D4E9F3A2F.webp','Terrasse'],
              ['A808A9D7-1606-4B0C-8AD3-90E8A0C3C952.webp','Eingang'],
              ['F92A8031-09EF-4707-BB0F-0EC08331DBFA.webp','Innenraum'],
              ['545483FE-4C7A-4F31-861C-81B7521FA83B.webp','Innenraum'],
              ['DB276184-A71A-467A-9E03-22D8D3D9AD5A.webp','Innenraum'],
              ['05DF0C85-F62E-46E0-9B51-83B20BC4A3AB.webp','Innenraum'],
              ['C66C6830-2946-4458-B7C9-436A152AF6B4.webp','Innenraum']
            ];
            const path = f => 'images/' + f;
            const hero = document.querySelector('.hero-img img');
            if (hero) { hero.src = path(imgs[0][0]); hero.alt = 'Burg Bistro Bella Vista'; }
            const photos = document.querySelector('.photos');
            if (photos) {
              photos.innerHTML = imgs.slice(0,3).map((x,i) => `<img class="${i===0?'tall':''}" src="${path(x[0])}" alt="${x[1]}" loading="lazy">`).join('');
            }
            const section = document.querySelector('#galerie');
            if (section) {
              section.innerHTML = `<div class="wrap"><div class="section-head"><div class="eyebrow">Impressionen</div><h2>Ein Blick ins Bistro</h2><p>Innenraum, Terrasse und die besondere Atmosphäre der Bella Vista.</p></div><div class="gallery gallery-new">${imgs.map((x,i)=>`<button class="gallery-item" type="button" data-src="${path(x[0])}"><img src="${path(x[0])}" alt="${x[1]}" loading="lazy"><span>${x[1]}</span></button>`).join('')}</div></div>`;
              section.querySelectorAll('.gallery-item').forEach(b => b.addEventListener('click', () => {
                const overlay = document.createElement('div');
                overlay.className = 'gallery-lightbox';
                overlay.innerHTML = `<button aria-label="Schließen">×</button><img src="${b.dataset.src}" alt="">`;
                document.body.appendChild(overlay);
                overlay.addEventListener('click', e => { if (e.target === overlay || e.target.tagName === 'BUTTON') overlay.remove(); });
              }));
            }
          })();
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'gallery.js' not in s:
              s=s.replace('</body>','<script src="gallery.js"></script></body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Improve gallery styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<style>.gallery-new{grid-template-columns:repeat(3,1fr)}.gallery-item{position:relative;border:0;padding:0;background:none;overflow:hidden;border-radius:18px;height:300px;cursor:pointer}.gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform .35s}.gallery-item:hover img{transform:scale(1.04)}.gallery-item span{position:absolute;left:12px;bottom:12px;background:#fffaf3e8;color:#7c4620;padding:6px 10px;border-radius:999px;font-weight:800;font-size:12px}.gallery-lightbox{position:fixed;inset:0;background:#000d;z-index:999;display:grid;place-items:center;padding:25px}.gallery-lightbox img{max-width:94vw;max-height:90vh;object-fit:contain;border-radius:14px}.gallery-lightbox button{position:absolute;top:18px;right:22px;border:0;background:#fff;color:#7c4620;width:44px;height:44px;border-radius:50%;font-size:30px;cursor:pointer}@media(max-width:900px){.gallery-new{grid-template-columns:1fr 1fr}.gallery-item{height:240px}}@media(max-width:600px){.gallery-new{grid-template-columns:1fr}.gallery-item{height:290px}}</style>'
          if 'gallery-lightbox' not in s:
              s=s.replace('</head>',css+'</head>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit optimized images and site changes
        run: |
          rm -f gallery-setup-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images index.html gallery.js
          git commit -m 'Add optimized restaurant photo gallery' || exit 0
          git push
