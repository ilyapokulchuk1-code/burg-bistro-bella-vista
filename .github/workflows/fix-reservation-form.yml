name: Fix reservation form
on:
  push:
    paths:
      - '.github/workflows/fix-reservation-form.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix reservation form language script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "function applyLang(){document.documentElement.lang=state.lang;document.querySelectorAll('[data-de]').forEach(el=>{const html=el.dataset[state.lang];if(html!==undefined)el.innerHTML=html});langBtn.textContent=state.lang==='de'?'EN':'DE';applyMenuLang()}"
          new = "function applyLang(){document.documentElement.lang=state.lang;document.querySelectorAll('[data-de]').forEach(el=>{const html=el.dataset[state.lang];if(html===undefined)return;if(el.tagName==='LABEL'&&el.querySelector('input,textarea,select')){const node=Array.from(el.childNodes).find(n=>n.nodeType===3);if(node)node.textContent=html+' '}else{el.innerHTML=html}});langBtn.textContent=state.lang==='de'?'EN':'DE';applyMenuLang()}"
          if old not in s:
              raise SystemExit('Target applyLang code not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix reservation form fields' || true
          git rm .github/workflows/fix-reservation-form.yml
          git commit -m 'Remove temporary form fix workflow'
          git push
